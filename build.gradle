plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Automated in-game tests: ./gradlew runClientGameTest builds a small power plant in a real world and checks it works.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wildcatter-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// The solver package must stay plain Java (no Minecraft or Fabric imports) so a NeoForge port is cheap. See CLAUDE.md.
tasks.register('verifySolverPurity') {
	def sources = fileTree('src/main/java/dev/wildcatter/solver') { include '**/*.java' }
	inputs.files(sources)
	doLast {
		sources.each { f ->
			if (f.text =~ /(?m)^\s*import\s+(net\.minecraft|net\.fabricmc|com\.mojang|dev\.wildcatter\.(?!solver))/) {
				throw new GradleException("${f.name} imports Minecraft, Fabric or non-solver code; the solver package must be pure Java")
			}
		}
	}
}
compileJava.dependsOn verifySolverPurity

dependencies {
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test {
	useJUnitPlatform()
}
