plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

// Common compiles against plain vanilla Minecraft (NeoForm), so nothing here can reach a loader's API.
neoForge {
	neoFormVersion = neo_form_version
	// unit tests may use plain Minecraft types (BlockPos, Direction) to drive circuit parts
	addModdingDependenciesTo(sourceSets.test)
}

dependencies {
	// Fabric and NeoForge both bundle Mixin, so common can hold mixins
	compileOnly('net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7')
	// JEI's loader-neutral API: compat/WildcatterJeiPlugin adds the ore pages. Not bundled; JEI is optional.
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testImplementation 'com.google.code.gson:gson:2.13.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
	// -Dwildcatter.bench=true runs the grid solve benchmark (GridSolveBenchmark) and prints its table
	def bench = providers.systemProperty('wildcatter.bench').getOrElse('false')
	systemProperty 'wildcatter.bench', bench
	testLogging.showStandardStreams = bench == 'true'
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// The solver package must stay plain Java (no Minecraft or loader imports). See CLAUDE.md.
tasks.register('verifySolverPurity') {
	def sources = fileTree('src/main/java/dev/wildcatter/solver') { include '**/*.java' }
	inputs.files(sources)
	doLast {
		sources.each { f ->
			if (f.text =~ /(?m)^\s*import\s+(net\.minecraft|net\.fabricmc|net\.neoforged|com\.mojang|dev\.wildcatter\.(?!solver))/) {
				throw new GradleException("${f.name} imports Minecraft, a loader or non-solver code; the solver package must be pure Java")
			}
		}
	}
}
compileJava.dependsOn verifySolverPurity

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}
