modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/timhunsaker-alt/Wildcatter/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
iconFile = "assets/wildcatter/icon.png"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Mekanism takes the plugs' FE through NeoForge's energy capability; nothing in Wildcatter needs it
[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
